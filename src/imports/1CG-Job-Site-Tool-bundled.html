unt=\"0\">\n                      <div title=\"{{sg.name}}\" style=\"width:100%;background:{{sg.color}};height:{{sg.pct}}%;box-shadow:0 -1px 0 rgba(255,255,255,0.85) inset;\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{dashSingleJob}}\" hint-placeholder-val=\"{{true}}\">\n                    <div style=\"width:100%;height:100%;background:#EC2027;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:#666;margin-top:8px;text-align:center;\">{{tb.title}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:2px solid {{borderColor}};border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n          <div style=\"font-weight:700;font-size:11px;letter-spacing:1.1px;color:#8a8a90;margin-bottom:16px;\">TASKS BY PRIORITY<\u002Fdiv>\n          <sc-if value=\"{{hasNoTasks}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"color:#999;font-size:14px;padding:20px 0;text-align:center;\">No tasks yet — add some in the Task Board tab.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{priorityBars}}\" as=\"pb\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:12px;\">\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;color:#333;margin-bottom:4px;\">\n                <span>{{pb.label}}<\u002Fspan>\n                <span>{{pb.count}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden;\">\n                <div style=\"height:100%;background:{{pb.color}};box-shadow:0 1px 0 rgba(255,255,255,0.3) inset;width:{{pb.pct}}%;border-radius:6px;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;borderColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#222222&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#222222&quot;, &quot;#dddddd&quot;, &quot;#EC2027&quot;, &quot;#999999&quot;]}}\">\n\nconst CHECKLIST_SECTIONS = [\n  { key: 'week1', title: 'Week 1', dateRange: true, weeks: [1, 1], items: [\n    'Client Contact (Phone and Email).',\n    'Project set up complete within Procore.',\n    'Schedule review.',\n    'Specification review.',\n    'Scope/Estimating Budget Review.',\n    'Buyout (Solidify Scope, Cost then Release ALL shop drawings).',\n    \"Issue LOI's as scope buyout progresses.\",\n    \"Submittal Requests (all product data, test reports, O&M's, physical samples, warranties, etc.) Physical samples request min of (4) but also per specifications.\",\n  ]},\n  { key: 'week2', title: 'Week 2', dateRange: true, weeks: [2, 2], items: [\n    'Develop Milestone Schedule (within 2 weeks of turnover). Smart Sheet is a great tool for this.',\n    'Create Submittal Log and send copy to the client for review.',\n    'You should have received a lot of the electronic submittals by now — populate the submittal log while creating it.',\n    'Work on PM material budget as items come in and get worked out.',\n    'Complete schedule of values and send to the client for review and approval.',\n  ]},\n  { key: 'week3_4', title: 'Week 3-4', dateRange: true, weeks: [3, 4], items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    'Continue to manage submittals and submittal log.',\n    \"Submit any RFI's gathered during review.\",\n    \"Send drafter specifics for the drawings (glass types, column line dimensions, what's not by 1CG, what's by 1CG, what's by the manufacturer, dimensions in feet or inches, etc.)\",\n    'Work on PM material budget as items come in and get worked out.',\n    \"Review submittal items that have come in. Log and submit as they come in if the project schedule doesn't allow for a complete submittal package at one time.\",\n    'Set up scheduled date for an internal \"project approach meeting\" (VP of construction, VP of operations, Safety coordinator, General superintendent, installer if determined, shop manager, estimator, etc. — use best judgment on whether this is required for the project).',\n    'Review and start putting together required info for the internal project approach meeting. Refer to the 1CG \"project approach guideline.\"',\n    'Project billings as applicable.',\n  ]},\n  { key: 'week5', title: 'Week 5', dateRange: true, weeks: [5, 5], items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    'Continue to manage submittals and submittal log.',\n    'Work on PM material budget as items come in and get worked out.',\n    'All physical samples should be in by now — review for accuracy, clean and label with 1CG labels, confirm with client where they want samples sent, box up and get with 1CG admin to ship.',\n    'Perform the internal \"project approach meeting.\" Make sure accurate detailed notes are taken.',\n    'Send out notes from the discussion to the entire team so everyone is on the same page.',\n    'If anything from the discussion affects the shop drawings, send those to the drafter to incorporate.',\n  ]},\n  { key: 'week6_8', title: 'Week 6-8', dateRange: true, weeks: [6, 8], items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    'Continue to manage submittals and submittal log.',\n    'You should be able to submit all items excluding shop drawings at this point.',\n    '1st submission shops received, reviewed, and sent out for internal constructability review (refer to the constructability review guideline).',\n    'Revise shop drawings to reflect any comments from reviews.',\n    'Send over any notes to the GC (if any) requiring attention from these reviews.',\n  ]},\n  { key: 'week8_10', title: 'Week 8-10', dateRange: true, weeks: [8, 10], items: [\n    'Prepare all scope items for the project AND turn over to operations for their budget (formal, in-person turnover — refer to the \"Internal Operations Budget Turnover Guideline\"; operations gets a 2-week turnaround).',\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    'Continue to manage submittals and submittal log.',\n    'Submit shop drawings if not already submitted.',\n    'Submit any remaining submittals.',\n    'Turn in PM final budget (including operations budget numbers) to your department head.',\n    'Project billings as applicable.',\n  ]},\n  { key: 'pre_material', title: 'Pre-Material Release', dateRange: false, items: [\n    'Shop drawings approved.',\n    'Finish selection approved.',\n    'Product data approved.',\n    'Physical samples approved.',\n    'Door hardware schedule and cut sheets approved.',\n    'Sequence plan sent to the metal vendor to ensure proper material optimization.',\n  ]},\n  { key: 'premobilization', title: 'Premobilization', dateRange: false, items: [\n    'Continue communications with client and internally to ensure the project approach is still on track.',\n    'Upon receipt of F&F shops, present the project to Field and Fabrication team (refer to the \"field and Fab turnover guideline\").',\n    'Confirm engineering is completed and incorporated into the field and file shops as applicable.',\n    'Order installation and fabrication supplies required — collaborate with the team to ensure everything is captured.',\n    'Complete Site Readiness inspections.',\n    'Confirm all safety documents, background checks, etc. are completed and submitted as applicable.',\n    'Confirm internally that the team is aligned on deliveries and frame construction (weight and sizes).',\n    'Confirm equipment is set up and ready to go.',\n    'Confirm laydown area is set up with client.',\n  ]},\n  { key: 'mobilization', title: 'Mobilization', dateRange: false, items: [\n    'Project manager, General Superintendent, Safety manager, and quality control manager required onsite for initial mobilization.',\n    'Get through onsite orientation as required by the client.',\n    'Review layout items — confirm all control lines, benchmarks, etc. are established and what they represent.',\n    'Go over the starting point and sequence again with the onsite Foreman and general contractor.',\n    'Review initial installation with the field team and walk through all steps if possible — ensure installation is per instructions, meets 1CG expectations and project intent. QC manager engaged.',\n  ]},\n  { key: 'completion_50_60', title: '50%-60% Completion', dateRange: false, items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    \"Review completed/remaining scope vs. PM's takeoff and allocated budget dollars — adjust as needed for accuracy.\",\n    'Pre-Punch.',\n    'Request retain reduction from the client.',\n  ]},\n  { key: 'completion_80', title: '80% Completion', dateRange: false, items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    \"Review completed/remaining scope vs. PM's takeoff and allocated budget dollars — adjust as needed for accuracy.\",\n    'Pre-Punch.',\n    'Start putting together an exit plan — review any/all possible loose ends ahead of completion.',\n  ]},\n  { key: 'completion_90_95', title: '90-95% Completion', dateRange: false, items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    \"Review completed/remaining scope vs. PM's takeoff and allocated budget dollars — adjust as needed for accuracy.\",\n    'Pre-Punch.',\n    'Confirm items on the previous exit plan were completed; keep walking the project and adding items as needed.',\n    'Request retain reduction from the client.',\n  ]},\n  { key: 'completion_95_100', title: '95-100% Completion', dateRange: false, items: [\n    'Continue client contact.',\n    'Continue contract drawing review (reviewing details in depth).',\n    'Manage building schedule and adjust and apply pressure where needed.',\n    \"Review completed/remaining scope vs. PM's takeoff and allocated budget dollars — adjust as needed for accuracy.\",\n    'Confirm items on the previous exit plan were completed; keep walking the project to 1CG standards.',\n    'Review and complete the punch list provided by the client.',\n    'Review and complete the punch list provided by the Owner and Architect.',\n    'Review project specifications for a refresher on closeout documents.',\n    'Start putting together all project closeout documentation per project specifications (follow \"Project Closeout Process — Procore\" document).',\n    'Once the substantial completion date is received, request all remaining closeouts (project-specific warranties).',\n    'Bill the project out 100%.',\n  ]},\n  { key: 'after_completion', title: 'After Completion', dateRange: false, items: [\n    'Bill retain 100%.',\n  ]},\n];\n\nconst INLINE_FIELDS = [\n  { key: 'projectName', label: 'Project Name', type: 'text' },\n  { key: 'projectManager', label: 'Project Manager', type: 'text' },\n  { key: 'awardDate', label: 'Award Date', type: 'date' },\n  { key: 'dateOfReport', label: 'Date of Report', type: 'date' },\n];\n\nconst TEXT_FIELDS = [\n  { key: 'projectProgress', label: 'Project Progress' },\n  { key: 'issuesRoadblocks', label: 'Issues/Roadblocks' },\n  { key: 'stepsAddressing', label: 'Steps Being Taken to Address These Issues' },\n  { key: 'delaysGC', label: 'Delays — GC' },\n  { key: 'delays1CG', label: 'Delays — 1CG' },\n  { key: 'pendingItems1CG', label: 'Pending Items — 1CG' },\n  { key: 'pendingItemsGC', label: 'Pending Items — GC' },\n  { key: 'materialsLeadTimes', label: 'Materials Lead Times' },\n  { key: 'schedule', label: 'Schedule (attach or fill out)' },\n  { key: 'manpowerWorkers', label: 'Manpower — # Workers Currently' },\n  { key: 'manpowerChanges', label: 'Manpower — Workforce Changes Since Last Report' },\n  { key: 'equipment', label: 'Equipment' },\n  { key: 'outstandingSubmittals', label: 'Outstanding Submittals (Current Submittal Log)' },\n  { key: 'outstandingChangeOrders', label: 'Outstanding Change Orders (Current PCO Log)' },\n  { key: 'additionalComments', label: 'Additional Comments' },\n];\n\nconst STORAGE_KEY = 'onecg-job-site-tool-v1';\n\nfunction blankDraft() {\n  const d = {};\n  INLINE_FIELDS.forEach(f => d[f.key] = '');\n  TEXT_FIELDS.forEach(f => d[f.key] = '');\n  return d;\n}\n\nfunction isValidJobSite(js) {\n  return js && typeof js === 'object' && typeof js.id === 'string' && typeof js.name === 'string'\n    && js.checklist && typeof js.checklist === 'object'\n    && js.draftReport && typeof js.draftReport === 'object'\n    && Array.isArray(js.reports) && Array.isArray(js.tasks) && Array.isArray(js.files);\n}\n\nconst JOB_COLOR_PALETTE = ['#1976D2', '#0277BD', '#00838F', '#00796B', '#2E7D32', '#558B2F', '#7B1FA2', '#512DA8', '#303F9F', '#C2185B', '#5D4037', '#455A64'];\n\nfunction hslToHex(h, s, l) {\n  s /= 100; l /= 100;\n  const k = n => (n + h / 30) % 12;\n  const a = s * Math.min(l, 1 - l);\n  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));\n  const toHex = n => Math.round(255 * f(n)).toString(16).padStart(2, '0');\n  return `#${toHex(0)}${toHex(8)}${toHex(4)}`;\n}\n\n// Picks the first palette color not currently used by an active job site; if the whole\n// palette is taken, generates a fresh distinct (non-red/orange) color instead of repeating one.\nfunction pickNextJobColor(jobSites) {\n  const used = new Set((jobSites || []).filter(js => !js.archived && js.color).map(js => js.color.toLowerCase()));\n  const free = JOB_COLOR_PALETTE.find(c => !used.has(c.toLowerCase()));\n  if (free) return free;\n  for (let i = 0; i < 200; i++) {\n    const hue = (137.508 * (used.size + i)) % 360; // golden-angle spread for max separation\n    if (hue > 345 || hue < 50) continue; // keep clear of red/orange\n    const candidate = hslToHex(hue, 55, 35);\n    if (!used.has(candidate.toLowerCase())) return candidate;\n  }\n  return hslToHex((Date.now() * 137.508) % 360, 55, 35);\n}\n\nfunction makeJobSite(name, color) {\n  return {\n    id: Date.now().toString() + Math.random().toString(36).slice(2, 7),\n    name: name || 'New Job Site',\n    turnoverDate: '',\n    checklist: {},\n    draftReport: blankDraft(),\n    reports: [],\n    tasks: [],\n    files: [],\n    color: color || JOB_COLOR_PALETTE[0],\n    archived: false,\n  };\n}\n\nfunction getScopedSites(scope, selectedIds, currentSite, allSites) {\n  if (scope === 'all') return allSites;\n  if (scope === 'custom') return allSites.filter(js => selectedIds.includes(js.id));\n  return [currentSite];\n}\n\nconst TASK_COLUMNS = [\n  { key: 'todo', title: 'To Do' },\n  { key: 'inprogress', title: 'In Progress' },\n  { key: 'done', title: 'Done' },\n];\n\n// Placeholder multi-user roster — stands in for real accounts once this tool is wired into the host site's auth.\nconst PLACEHOLDER_USERS = [\n  { id: 'user-1', name: 'User 1', role: 'Master' },\n  { id: 'user-2', name: 'User 2', role: 'Member' },\n  { id: 'user-3', name: 'User 3', role: 'Member' },\n];\n\nfunction initialsOf(name) {\n  return (name || '').split(/\\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');\n}\n\n\nfunction formatBytes(n) {\n  if (n < 1024) return n + ' B';\n  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';\n  return (n / (1024 * 1024)).toFixed(1) + ' MB';\n}\n\nfunction addDays(date, n) {\n  const d = new Date(date);\n  d.setDate(d.getDate() + n);\n  return d;\n}\n\nfunction getWeekRange(date) {\n  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());\n  const dow = d.getDay();\n  const mondayOffset = dow === 0 ? -6 : 1 - dow;\n  const start = new Date(d);\n  start.setDate(d.getDate() + mondayOffset);\n  const end = new Date(start);\n  end.setDate(start.getDate() + 6);\n  end.setHours(23, 59, 59, 999);\n  return { start, end };\n}\n\nfunction parseDateInput(str) {\n  const [y, m, d] = str.split('-').map(Number);\n  return new Date(y, m - 1, d);\n}\n\nfunction nextRecurrenceDate(dueDateStr, repeat, customInterval, customUnit) {\n  const base = dueDateStr ? parseDateInput(dueDateStr) : new Date();\n  const toStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\n  const d = new Date(base);\n  if (repeat === 'daily') {\n    d.setDate(d.getDate() + 1);\n  } else if (repeat === 'weekdays') {\n    do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);\n  } else if (repeat === 'weekly') {\n    d.setDate(d.getDate() + 7);\n  } else if (repeat === 'monthly') {\n    d.setMonth(d.getMonth() + 1);\n  } else if (repeat === 'yearly') {\n    d.setFullYear(d.getFullYear() + 1);\n  } else if (repeat === 'custom') {\n    const n = Math.max(1, parseInt(customInterval, 10) || 1);\n    const unit = customUnit || 'week';\n    if (unit === 'day') d.setDate(d.getDate() + n);\n    else if (unit === 'month') d.setMonth(d.getMonth() + n);\n    else d.setDate(d.getDate() + n * 7);\n  }\n  return toStr(d);\n}\n\nconst REPEAT_OPTIONS = [\n  { key: 'none', label: 'Does not repeat' },\n  { key: 'daily', label: 'Daily' },\n  { key: 'weekdays', label: 'Weekdays' },\n  { key: 'weekly', label: 'Weekly' },\n  { key: 'monthly', label: 'Monthly' },\n  { key: 'yearly', label: 'Yearly' },\n  { key: 'custom', label: 'Custom' },\n];\n\nfunction repeatLabelOf(repeat, customInterval, customUnit) {\n  if (repeat === 'custom') {\n    const n = Math.max(1, parseInt(customInterval, 10) || 1);\n    const unitLabel = { day: 'day', week: 'week', month: 'month' }[customUnit || 'week'];\n    return n === 1 ? `Every ${unitLabel}` : `Every ${n} ${unitLabel}s`;\n  }\n  const found = REPEAT_OPTIONS.find(o => o.key === repeat);\n  return found ? found.label : '';\n}\n\nconst TOOLS_REGISTRY = [\n  { key: 'tick-counter', name: 'Tick Counter', description: 'Quick tally counters for on-site counts — jambs, corners, punch items, anything you need to click off as you go.' },\n  { key: 'glass-tag-extractor', name: 'Glass Tag Extractor', description: 'Upload shop drawing screenshots and get a clean, editable table of glass tag data — ready to paste into Excel.' },\n];\n\nfunction mergeInPlace(allTasks, column, reorderedColTasks) {\n  let ci = 0;\n  return allTasks.map(t => t.column === column ? reorderedColTasks[ci++] : t);\n}\n\nfunction fmtDate(date) {\n  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n  const wd = weekdays[date.getDay()];\n  const m = date.getMonth() + 1;\n  const d = date.getDate();\n  const y = date.getFullYear() % 100;\n  return `${wd}, ${m}/${d}/${y < 10 ? '0' + y : y}`;\n}\n\nfunction computeWeekRanges(turnoverStr) {\n  const turnover = parseDateInput(turnoverStr);\n  const day = turnover.getDay(); // 0=Sun..6=Sat\n  let week1Start;\n  if (day >= 1 && day <= 3) {\n    week1Start = turnover;\n  } else {\n    const daysToMonday = (8 - day) % 7 || 7;\n    week1Start = addDays(turnover, day === 0 ? 1 : daysToMonday);\n  }\n  const daysToSunday = (7 - week1Start.getDay()) % 7;\n  const week1End = addDays(week1Start, daysToSunday);\n  const week2Start = addDays(week1End, 1);\n  function weekStart(n) {\n    if (n === 1) return week1Start;\n    return addDays(week2Start, (n - 2) * 7);\n  }\n  function weekEnd(n) {\n    if (n === 1) return week1End;\n    return addDays(weekStart(n), 6);\n  }\n  return { weekStart, weekEnd };\n}\n\n// One-time cleanup for job sites saved by the earlier batch-recurrence version: collapses any\n// tasks sharing a recurrenceId down to a single surviving instance (the current rolling model\n// keeps one card per recurring series instead of generating a dated series up front).\nfunction dedupeRecurringTasks(js) {\n  if (!js.tasks || !js.tasks.length) return js;\n  const groups = {};\n  js.tasks.forEach(t => { if (t.recurrenceId) (groups[t.recurrenceId] = groups[t.recurrenceId] || []).push(t); });\n  const toDrop = new Set();\n  Object.values(groups).forEach(group => {\n    if (group.length < 2) return;\n    const byDate = (a, b) => (a.dueDate || '').localeCompare(b.dueDate || '');\n    const notDone = group.filter(t => t.column !== 'done').sort(byDate);\n    const survivor = notDone[0] || group.slice().sort(byDate)[0];\n    group.forEach(t => { if (t.id !== survivor.id) toDrop.add(t.id); });\n  });\n  if (!toDrop.size) return js;\n  return { ...js, tasks: js.tasks.filter(t => !toDrop.has(t.id)).map(t => {\n    if (!t.recurrenceId) return t;\n    const { recurrenceId, ...rest } = t;\n    return rest;\n  }) };\n}\n\nclass Component extends DCLogic {\n  state = (() => {\n    let jobSites = [];\n    try {\n      const raw = localStorage.getItem(STORAGE_KEY);\n      if (raw) jobSites = JSON.parse(raw);\n    } catch (e) {}\n    if (!Array.isArray(jobSites)) jobSites = [];\n    jobSites = jobSites.filter(isValidJobSite);\n    jobSites = jobSites.reduce((acc, js) => {\n      if (js.color) { acc.push(js); return acc; }\n      acc.push({ ...js, color: pickNextJobColor(acc) });\n      return acc;\n    }, []);\n    jobSites = jobSites.map(dedupeRecurringTasks);\n    if (!jobSites.length) {\n      jobSites = [makeJobSite('New Job Site', JOB_COLOR_PALETTE[0])];\n    }\n    return {\n      jobSites,\n      currentJobSiteId: jobSites[0].id,\n      module: 'checklist',\n      reportTab: 'new',\n      copyStatus: '',\n      expandedReportId: null,\n      taskDrafts: {},\n      taskTargetJobId: null,\n      taskAddedToast: '',\n      composer: { text: '', dueDate: '', column: 'todo', jobId: null, urgent: false, important: false, assignee: '', repeat: 'none', customInterval: 1, customUnit: 'week' },\n      currentUserId: PLACEHOLDER_USERS[0].id,\n      userScopeIds: [],\n      userSwitcherOpen: false,\n      calendarMonth: { y: new Date().getFullYear(), m: new Date().getMonth() },\n      calendarScope: 'current',\n      calendarJobIds: [],\n      calendarEditingTask: null,\n      calendarOverflowPopover: null,\n      flashTaskId: null,\n      dashboardScope: 'current',\n      dashboardJobIds: [],\n      taskBoardScope: 'current',\n      taskBoardJobIds: [],\n      taskBoardViewMode: 'all',\n      taskSearchQuery: '',\n      taskBoardWeekAnchor: new Date().toISOString().slice(0, 10),\n      sendToTaskDraft: null,\n      jobActionsOpen: false,\n      confirmingJobAction: null,\n      utilityMenuOpen: false,\n      manageJobsModalOpen: false,\n      importStatus: '',\n      autoFilledFields: [],\n      autoFillNote: '',\n      byJobDrafts: {},\n      byJobOrder: [],\n      draggingJobBucketId: null,\n      navOrder: ['checklist', 'report', 'tasks', 'calendar', 'dashboard', 'byJob', 'tools'],\n      draggingNavKey: null,\n      toolsActiveKey: null,\n    };\n  })();\n\n  persist(jobSites) {\n    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(jobSites)); } catch (e) {}\n  }\n\n  getCurrentSite() {\n    return this.state.jobSites.find(js => js.id === this. .reports.length,\n\n      inlineFields,\n      textFields,\n      onAutoFillReport: () => this.autoFillReport(),\n      autoFillNote: this.state.autoFillNote,\n      copyStatus,\n      hasNoReports: site.reports.length === 0,\n      archiveEntries,\n\n      sendToTaskDraft: sendToTaskDraft ? (() => {\n        const d = sendToTaskDraft;\n        return {\n          text: d.text,\n          dueDate: d.dueDate,\n          onDueDateChange: (e) => this.setState(s => ({ sendToTaskDraft: { ...s.sendToTaskDraft, dueDate: e.target.value } })),\n          urgentBorder: d.urgent ? '#EC2027' : '#ccc',\n          urgentBg: d.urgent ? '#EC2027' : '#fff',\n          urgentColor: d.urgent ? '#fff' : '#666',\n          onToggleUrgent: () => this.setState(s => ({ sendToTaskDraft: { ...s.sendToTaskDraft, urgent: !s.sendToTaskDraft.urgent } })),\n          importantBorder: d.important ? '#F5A623' : '#ccc',\n          importantBg: d.important ? '#F5A623' : '#fff',\n          importantColor: d.important ? '#fff' : '#666',\n          onToggleImportant: () => this.setState(s => ({ sendToTaskDraft: { ...s.sendToTaskDraft, important: !s.sendToTaskDraft.important } })),\n          onCancel: () => this.setState({ sendToTaskDraft: null }),\n          onConfirm: () => {\n            this.addTask(site.id, 'todo', d.text, { dueDate: d.dueDate, urgent: d.urgent, important: d.important });\n            this.setState({ sendToTaskDraft: null });\n          },\n        };\n      })() : null,\n\n      copyReport: () => {\n        const lines = [];\n        allFieldDefs.forEach(f => {\n          lines.push(f.label + ':');\n          lines.push(site.draftReport[f.key] || '');\n          lines.push('');\n        });\n        const text = lines.join('\\n');\n        if (navigator.clipboard && navigator.clipboard.writeText) {\n          navigator.clipboard.writeText(text).then(() => {\n            this.setState({ copyStatus: 'Copied to clipboard' });\n            setTimeout(() => this.setState({ copyStatus: '' }), 2500);\n          }).catch(() => this.setState({ copyStatus: 'Copy failed' }));\n        }\n      },\n      printReport: () => window.print(),\n      saveReport: () => {\n        this.updateSite(site.id, js => ({\n          ...js,\n          reports: [{ id: Date.now().toString(), data: { ...js.draftReport } }, ...js.reports]\n        }));\n        this.setState({ copyStatus: 'Saved to archive' });\n        setTimeout(() => this.setState({ copyStatus: '' }), 2500);\n      },\n      newReport: () => {\n        if (window.confirm('Start a new blank report? Unsaved changes to the current report will be lost (past saved reports stay in the archive).')) {\n          this.updateSite(site.id, js => ({ ...js, draftReport: blankDraft() }));\n          this.setState({ autoFilledFields: [], autoFillNote: '' });\n        }\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"
