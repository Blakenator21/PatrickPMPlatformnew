document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-gradient(180deg,#fff 0%,#fafafb 100%);border-right:2px solid {{borderColor}};box-shadow:2px 0 10px rgba(16,18,28,0.05);display:flex;flex-direction:column;padding:20px 16px;box-sizing:border-box;gap:16px;\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <span style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:1.1px;\">JOB SITE<\u002Fspan>\n        <sc-raw-select value=\"{{currentJobSiteId}}\" sc-camel-on-change=\"{{onSelectJobSite}}\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid #c9c9cf;border-radius:8px;background:linear-gradient(180deg,#fff,#fafafb);box-shadow:inset 0 1px 2px rgba(16,18,28,0.07), 0 1px 0 #fff;font-weight:700;color:#1c1c1e;\">\n          <sc-for list=\"{{jobSiteOptions}}\" as=\"js\" hint-placeholder-count=\"1\">\n            <option value=\"{{js.id}}\">{{js.label}}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <button sc-camel-on-click=\"{{addJobSite}}\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;padding:9px 12px;border:1px solid #EC2027;background:linear-gradient(180deg,#fff,#fdf1f1);color:#EC2027;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap;box-shadow:0 1px 0 #fff inset, 0 2px 4px rgba(236,32,39,0.18);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 1px 0 #fff inset, 0 4px 10px rgba(236,32,39,0.26);\" style-active=\"transform:translateY(1px);box-shadow:0 1px 2px rgba(236,32,39,0.2);\">+ New Job Site<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;\">\n        <button sc-camel-on-click=\"{{onToggleUserSwitcher}}\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;font-weight:700;padding:9px 12px;border:1px solid #c9c9cf;border-radius:8px;background:linear-gradient(180deg,#fff,#fafafb);color:#2a2a30;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;box-shadow:inset 0 1px 2px rgba(16,18,28,0.05), 0 1px 0 #fff;\">👤 {{currentUserLabel}}<\u002Fbutton>\n        <sc-if value=\"{{userSwitcherOpen}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"position:absolute;top:calc(100% + 8px);left:0;width:250px;background:#fff;border:1px solid #d3d3d9;border-radius:12px;padding:14px;z-index:46;box-shadow:0 1px 0 rgba(255,255,255,0.8) inset, 0 18px 44px rgba(16,18,28,0.26), 0 2px 6px rgba(16,18,28,0.14);\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:0.9px;margin-bottom:6px;\">VIEWING AS<\u002Fdiv>\n            <sc-raw-select value=\"{{currentUserId}}\" sc-camel-on-change=\"{{onSelectCurrentUser}}\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid #c9c9cf;border-radius:7px;margin-bottom:14px;\">\n              <sc-for list=\"{{userOptions}}\" as=\"u\" hint-placeholder-count=\"3\">\n                <option value=\"{{u.id}}\">{{u.name}} ({{u.role}})<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <sc-if value=\"{{isMasterUser}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:0.9px;margin-bottom:6px;\">SHOW TASKS FOR<\u002Fdiv>\n              <sc-for list=\"{{userScopeOptions}}\" as=\"uo\" hint-placeholder-count=\"3\">\n                <label style=\"display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px;color:#333;cursor:pointer;\">\n                  <input type=\"checkbox\" checked=\"{{uo.checked}}\" sc-camel-on-change=\"{{uo.onToggle}}\">\n                  <span>{{uo.name}}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:10.5px;color:#a0a0a8;\">{{uo.role}}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{onResetUserScope}}\" style=\"margin-top:8px;width:100%;font-family:inherit;font-size:12px;font-weight:700;padding:6px;border:1px solid #ccc;border-radius:7px;background:#fff;color:#555;cursor:pointer;\">Show All Users<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;\">\n        <input type=\"text\" value=\"{{taskSearchQuery}}\" sc-camel-on-change=\"{{onTaskSearchChange}}\" placeholder=\"Search tasks…\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:13.5px;padding:9px 30px 9px 12px;border:1px solid #c9c9cf;border-radius:8px;background:linear-gradient(180deg,#fff,#fafafb);box-shadow:inset 0 1px 2px rgba(16,18,28,0.07), 0 1px 0 #fff;\">\n        <sc-if value=\"{{showTaskSearchResults}}\" hint-placeholder-val=\"{{false}}\">\n          <button sc-camel-on-click=\"{{onClearTaskSearch}}\" title=\"Clear search\" style=\"position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:transparent;color:#8a8a90;font-size:16px;font-weight:700;cursor:pointer;line-height:1;\">×<\u002Fbutton>\n          <div style=\"position:absolute;top:calc(100% + 8px);left:0;width:340px;max-height:440px;overflow-y:auto;background:#fff;border:1px solid #d3d3d9;border-radius:12px;padding:8px;z-index:45;box-shadow:0 1px 0 rgba(255,255,255,0.8) inset, 0 18px 44px rgba(16,18,28,0.26), 0 2px 6px rgba(16,18,28,0.14);\">\n            <sc-if value=\"{{hasNoTaskSearchResults}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"padding:16px 10px;text-align:center;font-size:13px;color:#999;\">No matching tasks.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{taskSearchResults}}\" as=\"r\" hint-placeholder-count=\"0\">\n              <div sc-camel-on-click=\"{{r.onClick}}\" style=\"display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background 0.12s;\" style-hover=\"background:#f4f4f7;\">\n                <span style=\"width:10px;height:10px;border-radius:2px;background:{{r.jobColor}};display:inline-block;flex-shrink:0;margin-top:4px;\"><\u002Fspan>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:13.5px;color:#222;line-height:1.4;overflow-wrap:anywhere;\">{{r.text}}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#8a8a90;margin-top:2px;\">{{r.jobName}} · {{r.columnTitle}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"height:2px;background:#d3d3d9;margin:4px 0;\"><\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <sc-for list=\"{{navTabs}}\" as=\"tab\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{tab.onClick}}\" draggable=\"{{true}}\" sc-camel-on-drag-start=\"{{tab.onDragStart}}\" sc-camel-on-drag-over=\"{{tab.onDragOver}}\" sc-camel-on-drop=\"{{tab.onDrop}}\" title=\"Drag to reorder\" style=\"width:100%;box-sizing:border-box;text-align:left;font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:0.2px;padding:11px 14px;border:1px solid {{tab.borderCol}};border-radius:8px;cursor:grab;background:{{tab.bg}};color:{{tab.color}};box-shadow:{{tab.shadow}};transition:transform 0.12s,box-shadow 0.12s,opacity 0.12s;opacity:{{tab.opacity}};\" style-hover=\"transform:translateX(2px);\" style-active=\"transform:translateX(0);\">{{tab.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;margin-top:auto;\">\n        <button sc-camel-on-click=\"{{onToggleUtilityMenu}}\" title=\"More options\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;font-weight:700;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d3d3d9;border-radius:8px;cursor:pointer;background:{{utilityMenuBg} on-click=\"{{onOpenManageJobs}}\" style=\"width:100%;text-align:left;font-family:inherit;font-size:13.5px;font-weight:700;color:#2a2a30;padding:10px 10px;border:none;background:transparent;border-radius:7px;cursor:pointer;display:block;\" style-hover=\"background:#f4f4f7;\">Archive or delete a job…<\u002Fbutton>\n            <sc-if value=\"{{importStatus}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"font-size:11.5px;font-weight:700;color:#EC2027;padding:8px 10px 4px;line-height:1.45;\">{{importStatus}}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;\">\n    <sc-if value=\"{{manageJobsModalOpen}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;inset:0;background:rgba(14,16,24,0.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;\">\n      <div style=\"background:#fff;border-radius:14px;padding:26px;width:520px;max-width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(16,18,28,0.34), 0 2px 8px rgba(16,18,28,0.2);\">\n        <div style=\"font-weight:700;font-size:11px;letter-spacing:1.1px;color:#8a8a90;margin-bottom:16px;\">ARCHIVE OR DELETE A JOB SITE<\u002Fdiv>\n        <sc-for list=\"{{jobManagementList}}\" as=\"jm\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;\">\n            <span style=\"width:10px;height:10px;border-radius:2px;background:{{jm.color}};display:inline-block;flex-shrink:0;\"><\u002Fspan>\n            <span style=\"font-size:14px;flex:1;min-width:120px;\">{{jm.name}}<\u002Fspan>\n            <sc-if value=\"{{jm.archived}}\" hint-placeholder-val=\"{{false}}\">\n              <span style=\"font-size:10.5px;color:#a0a0a8;font-weight:700;letter-spacing:0.8px;\">ARCHIVED<\u002Fspan>\n              <button sc-camel-on-click=\"{{jm.onUnarchive}}\" style=\"font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border:1px solid #d3d3d9;background:linear-gradient(180deg,#fff,#f3f3f6);color:#4a4a52;border-radius:7px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.12);transition:transform 0.12s;\" style-hover=\"transform:translateY(-1px);\">Unarchive<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{!jm.archived}}\" hint-placeholder-val=\"{{true}}\">\n              <button sc-camel-on-click=\"{{jm.onArchive}}\" style=\"font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border:1px solid #d3d3d9;background:linear-gradient(180deg,#fff,#f3f3f6);color:#4a4a52;border-radius:7px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.12);transition:transform 0.12s;\" style-hover=\"transform:translateY(-1px);\">Archive<\u002Fbutton>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{jm.onDelete}}\" style=\"font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border:1px solid #EC2027;background:linear-gradient(180deg,#fff,#fdf1f1);color:#EC2027;border-radius:7px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(236,32,39,0.2);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 3px 9px rgba(236,32,39,0.26);\">Delete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{onCloseManageJobs}}\" style=\"width:100%;margin-top:20px;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:1px solid #d3d3d9;background:linear-gradient(180deg,#fff,#f3f3f6);color:#2a2a30;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.12);\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{jobActionConfirm}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;inset:0;background:rgba(14,16,24,0.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px;\">\n      <div style=\"background:#fff;border-radius:14px;padding:26px;width:380px;max-width:100%;box-shadow:0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(16,18,28,0.34), 0 2px 8px rgba(16,18,28,0.2);\">\n        <div style=\"font-weight:700;font-size:16px;margin-bottom:12px;\">Are you sure?<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.55;margin-bottom:22px;color:#3a3a42;\">{{jobActionConfirm.message}}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <button sc-camel-on-click=\"{{jobActionConfirm.onCancel}}\" style=\"flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:1px solid #d3d3d9;background:linear-gradient(180deg,#fff,#f3f3f6);color:#2a2a30;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.12);\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{jobActionConfirm.onConfirm}}\" style=\"flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border:1px solid #c4181e;background:linear-gradient(180deg,#f4474d 0%,#EC2027 55%,#cf1a20 100%);color:#fff;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 3px 9px rgba(236,32,39,0.35);\">{{jobActionConfirm.confirmLabel}}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isChecklist}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"max-width:920px;margin:0 auto;padding:32px 40px 80px;\">\n      <div style=\"display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:16px;\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;color:#8a8a90;letter-spacing:1.1px;margin-bottom:6px;\">JOB SITE NAME<\u002Fdiv>\n          <input type=\"text\" value=\"{{jobSiteName}}\" sc-camel-on-change=\"{{onNameChange}}\" place e6ea;border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(16,18,28,0.18);\">\n          <div style=\"height:100%;background:linear-gradient(180deg,#f4474d,#EC2027 55%,#c4181e);width:{{progressPct}}%;border-radius:5px;transition:width 0.35s ease;box-shadow:0 1px 0 rgba(255,255,255,0.35) inset;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;font-weight:700;color:#6c6c74;white-space:nowrap;letter-spacing:0.2px;\">{{completedCount}} / {{totalCount}} complete<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{sections}}\" as=\"section\" hint-placeholder-count=\"6\">\n        <div style=\"margin-bottom:24px;border:2px solid {{borderColor}};border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n          <div style=\"background:linear-gradient(180deg,#f4474d 0%,#EC2027 55%,#cf1a20 100%);color:#fff;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 1px 0 rgba(255,255,255,0.28) inset, 0 -1px 0 rgba(0,0,0,0.12) inset;\">\n            <div style=\"font-weight:700;font-size:16px;letter-spacing:0.3px;text-shadow:0 1px 1px rgba(0,0,0,0.18);\">{{section.title}}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <sc-if value=\"{{section.showDate}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"font-size:12px;font-weight:700;opacity:0.95;letter-spacing:0.3px;margin-right:4px;\">{{section.dateLabel}}<\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{section.onCheckAll}}\" title=\"Check all in this section\" style=\"font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:0.6px;padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,0.55);background:rgba(255,255,255,0.16);color:#fff;cursor:pointer;white-space:nowrap;transition:background 0.12s,transform 0.12s;\" style-hover=\"background:rgba(255,255,255,0.3);transform:translateY(-1px);\">CHECK ALL<\u002Fbutton>\n              <button sc-camel-on-click=\"{{section.onClearAll}}\" title=\"Clear all in this section\" style=\"font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:0.6px;padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,0.55);background:rgba(255,255,255,0.16);color:#fff;cursor:pointer;white-space:nowrap;transition:background 0.12s,transform 0.12s;\" style-hover=\"background:rgba(255,255,255,0.3);transform:translateY(-1px);\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:6px 10px;\">\n            <sc-for list=\"{{section.items}}\" as=\"item\" hint-placeholder-count=\"5\">\n              <label style=\"display:flex;align-items:flex-start;gap:12px;padding:11px 12px;margin:2px 0;border-radius:8px;cursor:pointer;background:{{item.bg}};color:{{item.color}};transition:background 0.15s,box-shadow 0.15s;\" style-hover=\"background:#f4f4f7;box-shadow:inset 0 0 0 1px rgba(16,18,28,0.06);\">\n                <input type=\"checkbox\" checked=\"{{item.checked}}\" sc-camel-on-change=\"{{item.onToggle}}\" style=\"margin-top:3px;width:19px;height:19px;flex-shrink:0;accent-color:#EC2027;cursor:pointer;border-radius:4px;\">\n                <span style=\"font-size:15px;line-height:1.55;flex:1;\">{{item.text}}<\u002Fspan>\n                <sc-if value=\"{{item.onBoard}}\" hint-placeholder-val=\"{{false}}\">\n                  <button sc-camel-on-click=\"{{item.onGoToCalendar}}\" data-tip=\"{{item.boardTooltip}}\" style=\"--tip-op:0;--tip-y:4px;position:relative;display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:0.5px;padding:5px 10px;border-radius:11px;border:1px solid #EC2027;background:linear-gradient(180deg,#fdeced,#fbdcde);color:#c4181e;flex-shrink:0;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.7) inset, 0 1px 3px rgba(236,32,39,0.18);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"--tip-op:1;--tip-y:0px;transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,0.7) inset, 0 4px 11px rgba(236,32,39,0.28);\" style-after=\"content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);right:0;opacity:var(--tip-op);transform:translateY(var(--tip-y));transition:opacity 0.14s ease,transform 0.14s ease;pointer-events:none;white-space:nowrap;font-size:11.5px;font-weight:600;letter-spacing:0.1px;padding:8px 12px;border-radius:8px;background:linear-gradient(180deg,#33333c,#1b1b21);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,0.14) inset, 0 8px 22px rgba(16,18,28,0.34);z-index:20;\">\n                    <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 384 512\" fill=\"currentColor\"><path d=\"M32 32C32 14.3 46.3 0 64 0H320c17.7 0 32 14.3 32 32s-14.3 32-32 32h-8.4l14.2 92.2c35.9 20 64.1 53.9 76.3 95.8H16.4C28.6 214.9 56.8 181 92.7 161L106.9 64H64C46.3 64 32 49.7 32 32zM160 384h64v96c0 17.7-14.3 32-32 32s-32-14.3-32-32V384z\"><\u002Fpath><\u002Fsvg>\n                    ON BOARD\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{item.onSendToTasks}}\" title=\"Send to Task Board\" style=\"font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.3px;padding:5px 11px;border-radius:11px;border:1px solid #d3d3d9;background:linear-gradient(180deg,#fff,#f4f4f7);color:#6c6c74;cursor:pointer;flex-shrink:0;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.1);transition:transform 0.12s,box-shadow 0.12s,color 0.12s;\" style-hover=\"transform:translateY(-1px);color:#EC2027;border-color:#EC2027;box-shadow:0 2px 7px rgba(236,32,39,0.2);\">+ Task<\u002Fbutton>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isReport}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"max-width:820px;margin:0 auto;padding:32px 40px 100px;\">\n      <div data-no-print=\"\" style=\"display:flex;gap:8px;margin-bottom:28px;border-bottom:2px solid {{borderColor}};\">\n        <button sc-camel-on-click=\"{{goToNewReport}}\" style=\"font-family:inherit;font-size:14px;font-weight:700;padding:10px 4px;margin-right:20px;border:none;border-bottom:3px solid {{newTabBorder}};background:transparent;color:{{newTabColor}};cursor:pointer;\">New Report<\u002Fbutton>\n        <button sc-camel-on-click=\"{{goToArchive}}\" style=\"font-family:inherit;font-size:14px;font-weight:700;padding:10px 4px;border:none;border-bottom:3px solid {{archiveTabBorder}};background:transparent;color:{{archiveTabColor}};cursor:pointer;\">Past Reports ({{reportCount}})<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{isNewReportTab}}\" hint-placeholder-val=\"{{true}}\">\n        <div data-no-print=\"\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:26px;padding:14px 16px;background:linear-gradient(180deg,#fff,#f6f6f8);border:2px solid {{borderColor}};border-radius:12px;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n          <div style=\"flex:1;min-width:200px;\">\n            <div style=\"font-size:10.5px;font-weight:700;letter-spacing:1px;color:#8a8a90;margin-bottom:3px;\">FIRST DRAFT<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6c6c74;line-height:1.45;\">Fills only the factual fields it can source from this job, and only where you've left them blank.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{onAutoFillReport}}\" style=\"font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.2px;padding:9px 16px;border:1px solid #c4181e;background:linear-gradient(180deg,#f4474d 0%,#EC2027 55%,#cf1a20 100%);color:#fff;border-radius:8px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 3px 9px rgba(236,32,39,0.35);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 16px rgba(236,32,39,0.4);\" style-active=\"transform:translateY(1px);\">Auto-fill from job data<\u002Fbutton>\n          <button sc-camel-on-click=\"{{newReport}}\" style=\"font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.2px;padding:9px 16px;border:1px solid #d3d3d9;background:linear-gradient(180deg,#fff,#f3f3f6);color:#4a4a52;border-radius:8px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.12);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 4px 11px rgba(16,18,28,0.16);\" style-active=\"transform:translateY(1px);\">Start blank<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{autoFillNote}}\" hint-placeholder-val=\"{{false}}\">\n          <div data-no-print=\"\" style=\"font-size:12.5px;font-weight:700;color:#c4181e;margin:-14px 0 24px;\">{{autoFillNote}}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px 36px;margin-bottom:40px;\">\n          <sc-for list=\"{{inlineFields}}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:8px;\">\n                <span style=\"font-weight:700;font-size:14px;\">{{f.label}}<\u002Fspan>\n                <sc-if value=\"{{f.isAuto}}\" hint-placeholder-val=\"{{false}}\">\n                  <span data-no-print=\"\" title=\"Drafted from job data — edit freely\" style=\"font-size:9.5px;font-weight:700;letter-spacing:0.8px;padding:3px 7px;border-radius:9px;border:1px solid #EC2027;background:linear-gradient(180deg,#fdeced,#fbdcde);color:#c4181e;\">AUTO<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <input type=\"{{f.type}}\" value=\"{{f.value}}\" sc-camel-on-change=\"{{f.onChange}}\" style=\"width:100%;box-sizing:border-box;border:none;border-bottom:2px solid {{borderColor}};padding:8px 0;font-size:15px;font-family:inherit;background:transparent;\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{textFields}}\" as=\"f\" hint-placeholder-count=\"15\">\n          <div style=\"margin-bottom:34px;\">\n            <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:8px;\">\n              <span style=\"font-weight:700;font-size:14px;\">{{f.label}}<\u002Fspan>\n              <sc-if value=\"{{f.isAuto}}\" hint-placeholder-val=\"{{false}}\">\n                <span data-no-print=\"\" title=\"Drafted from job data — edit freely\" style=\"font-size:9.5px;font-weight:700;letter-spacing:0.8px;padding:3px 7px;border-radius:9px;border:1px solid #EC2027;background:linear-gradient(180deg,#fdeced,#fbdcde);color:#c4181e;\">AUTO<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <textarea value=\"{{f.value}}\" sc-camel-on-change=\"{{f.onChange}}\" rows=\"{{f.rows}}\" style=\"width:100%;box-sizing:border-box;border:none;border-bottom:2px solid {{borderColor}};padding:8px 0;font-size:15px;font-family:inherit;background:transparent;resize:none;line-height:1.6;\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div data-no-print=\"\" style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:16px;border-top:2px solid {{borderColor}};\">\n          <button sc-camel-on-click=\"{{copyReport}}\" style=\"font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;border:1px solid #EC2027;background:linear-gradient(180deg,#f4474d 0%,#EC2027 55%,#cf1a20 100%);color:#fff;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 3px 9px rgba(236,32,39,0.35);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 16px rgba(236,32,39,0.4);\" style-active=\"transform:translateY(1px);\">Copy as Text<\u002Fbutton>\n          <button sc-camel-on-click=\"{{printReport}}\" style=\"font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;border:1px solid #EC2027;background:linear-gradient(180deg,#fff,#fdf1f1);color:#EC2027;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 2px 5px rgba(236,32,39,0.2);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 5px 13px rgba(236,32,39,0.26);\" style-active=\"transform:translateY(1px);\">Print / PDF<\u002Fbutton>\n          <button sc-camel-on-click=\"{{saveReport}}\" style=\"font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;border:1px solid #999;background:linear-gradient(180deg,#fff,#f3f3f6);color:#4a4a52;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.14);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 4px 11px rgba(16,18,28,0.16);\" style-active=\"transform:translateY(1px);\">Save to Archive<\u002Fbutton>\n          <button sc-camel-on-click=\"{{newReport}}\" style=\"font-family:inherit;font-size:14px;padding:10px 18px;border:none;background:transparent;color:#999;cursor:pointer;\">Start New Report<\u002Fbutton>\n          <span style=\"font-size:13px;color:#2e7d32;font-weight:700;\">{{copyStatus}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isArchiveTab}}\" hint-placeholder-val=\"{{false}}\">\n        <sc-if value=\"{{hasNoReports}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"color:#999;font-size:15px;padding:40px 0;text-align:center;\">No saved reports yet for this job site.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{archiveEntries}}\" as=\"r\" hint-placeholder-count=\"0\">\n          <div style=\"border:2px solid {{borderColor}};border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n            <div style=\"display:flex;align-items:center;gap:16px;padding:14px 18px;background:#fafafa;flex-wrap:wrap;\">\n              <div style=\"font-weight:700;font-size:15px;\">{{r.dateOfReport}}<\u002Fdiv>\n              <div style=\"color:#666;font-size:14px;\">{{r.projectName}}<\u002Fdiv>\n              <div style=\"margin-left:auto;display:flex;gap:8px;\">\n                <button sc-camel-on-click=\"{{r.onToggleView}}\" style=\"font-family:inherit;font-size:13px;padding:6px 12px;border:1px solid #ccc;background:linear-gradient(180deg,#fff,#f3f3f6);color:#4a4a52;font-weight:700;border-radius:7px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 1px 3px rgba(16,18,28,0.12);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,18,28,0.15);\" style-active=\"transform:translateY(1px);\">{{r.viewLabel}}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{r.onDuplicate}}\" style=\"font-family:inherit;font-size:13px;padding:6px 12px;border:1px solid #EC2027;background:linear-gradient(180deg,#fff,#fdf1f1);color:#EC2027;font-weight:700;border-radius:7px;cursor:pointer;box-shadow:0 1px 0 #fff inset, 0 2px 5px rgba(236,32,39,0.2);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 5px 13px rgba(236,32,39,0.26);\" style-active=\"transform:translateY(1px);\">Duplicate as New<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{r.expanded}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"padding:18px;\">\n                <sc-for list=\"{{r.rows}}\" as=\"row\" hint-placeholder-count=\"0\">\n                  <div style=\"margin-bottom:16px;\">\n                    <div style=\"font-weight:700;font-size:13px;color:#666;margin-bottom:4px;\">{{row.label}}<\u002Fdiv>\n                    <div style=\"font-size:14px;white-space:pre-wrap;line-height:1.6;\">{{row.value}}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isTasks}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:32px 40px 80px;\">\n      <sc-if value=\"{{taskAddedToast}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background:linear-gradient(180deg,#2e2e36,#1b1b21);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:0.2px;padding:9px 16px;border-radius:8px;margin-bottom:14px;display:inline-block;box-shadow:0 1px 0 rgba(255,255,255,0.12) inset, 0 6px 18px rgba(16,18,28,0.3);\">{{taskAddedToast}}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"background:#fff;border:2px solid {{borderColor}};border-radius:12px;padding:16px 18px;margin-bottom:24px;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n        <div style=\"font-weight:700;font-size:11px;letter-spacing:1.1px;color:#8a8a90;margin-bottom:12px;\">NEW TASK<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;\">\n          <div style=\"flex:2;min-width:220px;\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:0.9px;margin-bottom:5px;\">TASK<\u002Fdiv>\n            <input type=\"text\" value=\"{{composer.text}}\" sc-camel-on-change=\"{{composer.onTextChange}}\" sc-camel-on-key-down=\"{{composer.onKeyDown}}\" placeholder=\"Describe the task…\" style=\"width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;padding:8px 9px;border:1px solid #c9c9cf;border-radius:7px;box-shadow:inset 0 1px 2px rgba(16,18,28,0.07);\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:0.9px;margin-bottom:5px;\">DUE DATE<\u002Fdiv>\n            <input type=\"date\" value=\"{{composer.dueDate}}\" sc-camel-on-change=\"{{composer.onDueDateChange}}\" style=\"font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid #c9c9cf;border-radius:7px;box-shadow:inset 0 1px 2px rgba(16,18,28,0.07);\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:0.9px;margin-bottom:5px;\">REPEAT<\u002Fdiv>\n            <sc-raw-select value=\"{{composer.repeat}}\" sc-camel-on-change=\"{{composer.onRepeatChange}}\" style=\"font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid #c9c9cf;border-radius:7px;background:linear-gradient(180deg,#fff,#fafafb);box-shadow:inset 0 1px 2px rgba(16,18,28,0.07);\">\n              <sc-for list=\"{{repeatOptions}}\" as=\"ro\" hint-placeholder-count=\"7\">\n                <option value=\"{{ro.key}}\">{{ro.label}}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <sc-if value=\"{{composer.isCustomRepeat}}\" hint-placeholder-val=\"{{false}}\">\n            <div>\n              <div style=\"font-size:10.5px;font-weight:700;color:#8a8a90;letter-spacing:0.9px;margin-bottom:5px;\">EVERY<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\">\n                <input type=\"number\" min=\"1\" value=\"{{composer.customInterval}}\" sc-camel-on-change=\"{{composer.onCustomIntervalChange}}\" style=\"width:52px;font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid #c9c9cf;border-radius:7px;box-shadow:inset 0 1px 2px rgba(16,18,28,0.07);\">\n                <sc-raw-select value=\"{{composer.customUnit}}\" sc-camel-on-change=\"{{composer.onCustomUnitChange}}\" style=\"font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid #c9c9cf;border-radius:7px;background:linear-gradient(180deg,#fff,#fafafb);box-shadow:inset 0 1px 2px rgba(16,18,28,0.07);\">\n                  <option value=\"day\">Day(s)<\u002Foption>\n                  <option value=\"week\">Week near-gradient(180deg,#fff,#fafafb);box-shadow:inset 0 1px 2px rgba(16,18,28,0.07);\">\n              <sc-for list=\"{{composer.userOptions}}\" as=\"u\" hint-placeholder-count=\"3\">\n                <option value=\"{{u.id}}\">{{u.name}}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{composer.onToggleUrgent}}\" style=\"font-family:inherit;font-size:12px;font-weight:700;padding:8px 12px;border-radius:14px;border:1px solid {{composer.urgentBorder}};background:{{composer.urgentBg}};color:{{composer.urgentColor}};cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,0.12);transition:transform 0.1s;\" style-hover=\"transform:translateY(-1px);\" style-active=\"transform:translateY(1px);box-shadow:none;\">Urgent<\u002Fbutton>\n          <button sc-camel-on-click=\"{{composer.onToggleImportant}}\" style=\"font-family:inherit;font-size:12px;font-weight:700;padding:8px 12px;border-radius:14px;border:1px solid {{composer.importantBorder}};background:{{composer.importantBg}};color:{{composer.importantColor}};cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,0.12);transition:transform 0.1s;\" style-hover=\"transform:translateY(-1px);\" style-active=\"transform:translateY(1px);box-shadow:none;\">Important<\u002Fbutton>\n          <button sc-camel-on-click=\"{{composer.onAdd}}\" style=\"font-family:inherit;font-size:14px;font-weight:700;letter-spacing:0.2px;padding:10px 20px;border:1px solid #c4181e;background:linear-gradient(180deg,#f4474d 0%,#EC2027 55%,#cf1a20 100%);color:#fff;border-radius:8px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 3px 9px rgba(236,32,39,0.35);transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 16px rgba(236,32,39,0.4);\" style-active=\"transform:translateY(1px);box-shadow:0 2px 5px rgba(236,32,39,0.3);\">Add Task<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;\">\n        <sc-for list=\"{{taskBoardScopeOptions}}\" as=\"opt\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{opt.onClick}}\" style=\"font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:0.2px;padding:8px 15px;border:1px solid {{opt.borderCol}};border-radius:8px;cursor:pointer;background:{{opt.bgCss}};color:{{opt.color}};box-shadow:{{opt.shadow}};transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);\" style-active=\"transform:translateY(1px);\">{{opt.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{isTaskBoardCustomScope}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;\">\n          <sc-for list=\"{{taskBoardJobChips}}\" as=\"jc\" hint-placeholder-count=\"3\">\n            <label style=\"display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;\">\n              <input type=\"checkbox\" checked=\"{{jc.checked}}\" sc-camel-on-change=\"{{jc.onToggle}}\">\n              <span style=\"width:10px;height:10px;border-radius:2px;background:{{jc.color}};display:inline-block;\"><\u002Fspan>\n              {{jc.name}}\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;\">\n        <sc-for list=\"{{taskBoardViewOptions}}\" as=\"vo\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{vo.onClick}}\" style=\"font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:0.2px;padding:8px 15px;border:1px solid {{vo.borderCol}};border-radius:8px;cursor:pointer;background:{{vo.bgCss}};color:{{vo.color}};box-shadow:{{vo.shadow}};transition:transform 0.12s,box-shadow 0.12s;\" style-hover=\"transform:translateY(-1px);\" style-active=\"transform:translateY(1px);\">{{vo.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{isTaskBoardCustomWeek}}\" hint-placeholder-val=\"{{false}}\">\n          <input type=\"date\" value=\"{{taskBoardWeekAnchor}}\" sc-camel-on-change=\"{{onTaskBoardWeekAnchorChange}}\" style=\"font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid #ccc;border-radius:7px;\">\n        <\u002Fsc-if>\n        <sc-if value=\"{{isTaskBoardWeekFiltered}}\" hint-placeholder-val=\"{{false}}\">\n          <span style=\"font-size:12px;color:#666;font-weight:700;\">{{taskBoardWeekLabel}}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch;\">\n        <sc-for list=\"{{taskColumns}}\" as=\"col\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-drag-over=\"{{col.onDragOver}}\" sc-camel-on-drop=\"{{col.onDrop}}\" style=\"background:#fff;border:2px solid {{borderColor}};border-radius:12px;min-height:200px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n            <div style=\"padding:13px 16px;border-bottom:2px solid #EC2027;font-weight:700;font-size:13px;letter-spacing:0.8px;text-transform:uppercase;display:flex;justify-content:space-between;background:linear-gradient(180deg,#fff,#f5f5f8);border-radius:10px 10px 0 0;\">\n              <span style=\"color:#2a2a30;\">{{col.title}}<\u002Fspan>\n              <span style=\"color:#a0a0a8;font-variant-numeric:tabular-nums;\">{{col.count}}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:10px;flex:1;display:flex;flex-direction:column;gap:8px;min-height:120px;\">\n              <sc-for list=\"{{col.tasks}}\" as=\"task\" hint-placeholder-count=\"2\">\n                <div draggable=\"{{true}}\" data-task-id=\"{{task.id}}\" sc-camel-on-drag-start=\"{{task.onDragStart}}\" sc-camel-on-drag-over=\"{{task.onDragOver}}\" sc-camel-on-drop=\"{{task.onDrop}}\" style=\"border:2px solid {{task.cardBorder}};border-radius:10px;padding:10px 12px;background:{{task.cardBg}};color:{{task.textColor}};cursor:grab;box-shadow:0 1px 2px rgba(16,18,28,0.09), 0 3px 8px rgba(16,18,28,0.1);transition:transform 0.1s,box-shadow 0.1s;animation:{{task.flashAnim}};\" style-hover=\"transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.16);\">\n                  <sc-if value=\"{{task.showJobBadge}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-bottom:6px;color:{{task.textColor}};\">\n                      <span style=\"width:8px;height:8px;border-radius:2px;background:{{task.jobBadgeColor}};display:inline-block;flex-shrink:0;\"><\u002Fspan>\n                      {{task.jobBadgeName}}\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:6px;\">\n                    <div style=\"font-size:14px;line-height:1.4;flex:1;\">{{task.text}}<\u002Fdiv>\n                    <span title=\"{{task.assigneeName}}\" style=\"width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.28);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:0.2px;\">{{task.assigneeInitials}}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{task.onTogglePin}}\" title=\"Pin task\" style=\"border:2px solid {{task.pinColor}};border-radius:6px;background:transparent;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;box-shadow:0 2px 0 rgba(0,0,0,0.18);transition:transform 0.1s;\" style-hover=\"transform:translateY(-1px);\" style-active=\"transform:translateY(1px);box-shadow:none;\">\n                      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 384 512\" fill=\"{{t       <div style=\"width:100%;margin-top:18px;border-top:1px solid #ececf0;padding-top:14px;display:flex;flex-direction:column;gap:10px;\">\n              <sc-for list=\"{{dashJobProgress}}\" as=\"jp\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                  <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#4a4a52;\">\n                    <span style=\"width:9px;height:9px;border-radius:2px;background:{{jp.color}};display:inline-block;flex-shrink:0;\"><\u002Fspan>\n                    <span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{jp.name}}<\u002Fspan>\n                    <span style=\"font-weight:700;font-variant-numeric:tabular-nums;color:#2a2a30;\">{{jp.pct}}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:8px;background:#f0f0f3;border-radius:4px;overflow:hidden;\">\n                    <div style=\"height:100%;background:{{jp.color}};width:{{jp.pct}}%;border-radius:4px;\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:2px solid {{borderColor}};border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(16,18,28,0.06), 0 6px 18px rgba(16,18,28,0.07);\">\n          <div style=\"font-weight:700;font-size:11px;letter-spacing:1.1px;color:#8a8a90;margin-bottom:16px;\">PROGRESS BY SECTION<\u002Fdiv>\n          <sc-for list=\"{{sectionBars}}\" as=\"sb\" hint-placeholder-count=\"6\">\n            <div style=\"margin-bottom:10px;\">\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#555;margin-bottom:4px;\">\n                <span>{{sb.title}}<\u002Fspan>\n                <span>{{sb.completed}}/{{sb.total}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:10px;background:#f0
